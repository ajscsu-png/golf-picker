name: dependabot-automerge

# Merges green Dependabot patch/minor PRs on a schedule so nobody has to click.
# Majors are left open for review. A PR that has fallen behind main or has a
# lockfile conflict gets an `@dependabot rebase` and is retried next run.
# Deliberately a scheduled job, not GitHub's auto-merge feature.

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge safe Dependabot PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          is_safe() { # $1 = PR title
            local t="$1"
            # Grouped updates are configured as "...-minor-and-patch" in dependabot.yml.
            if [[ "$t" == *"minor-and-patch group"* || "$t" == *"-and-patch group"* ]]; then return 0; fi
            if [[ "$t" =~ from\ ([0-9]+)\.?([0-9]*)[^\ ]*\ to\ ([0-9]+)\.?([0-9]*) ]]; then
              local fm="${BASH_REMATCH[1]}" fn="${BASH_REMATCH[2]}" tm="${BASH_REMATCH[3]}" tn="${BASH_REMATCH[4]}"
              [ "$fm" = "$tm" ] || return 1
              # 0.x versions: a minor bump can break, treat as major.
              if [ "$fm" = "0" ] && [ "$fn" != "$tn" ]; then return 1; fi
              return 0
            fi
            return 1
          }
          gh pr list --repo "$REPO" --author "app/dependabot" --state open --limit 100 \
            --json number,title | jq -c '.[]' | while read -r pr; do
            n=$(jq -r .number <<<"$pr"); title=$(jq -r .title <<<"$pr")
            if ! is_safe "$title"; then echo "#$n skip (major/unknown): $title"; continue; fi
            info=$(gh pr view "$n" --repo "$REPO" --json mergeStateStatus,headRefOid,statusCheckRollup) || { echo "#$n could not read status"; continue; }
            state=$(jq -r .mergeStateStatus <<<"$info"); sha=$(jq -r .headRefOid <<<"$info")
            total=$(jq '.statusCheckRollup | length' <<<"$info")
            bad=$(jq '[.statusCheckRollup[] | select(
                (.status? // "COMPLETED") != "COMPLETED"
                or ((.conclusion? // .state? // "SUCCESS") | IN("SUCCESS","SKIPPED","NEUTRAL") | not))] | length' <<<"$info")
            if [ "$state" = "BEHIND" ] || [ "$state" = "DIRTY" ]; then
              echo "#$n $state: asking Dependabot to rebase"
              gh pr comment "$n" --repo "$REPO" --body "@dependabot rebase" >/dev/null
              continue
            fi
            if [ "$total" -eq 0 ] || [ "$bad" -ne 0 ] || [ "$state" != "CLEAN" ]; then
              echo "#$n not ready (state=$state checks=$total notgreen=$bad)"; continue
            fi
            if gh pr merge "$n" --repo "$REPO" --merge --delete-branch --match-head-commit "$sha"; then
              echo "#$n merged: $title"
            else
              echo "#$n merge failed, will retry next run"
            fi
          done
